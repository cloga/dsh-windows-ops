locale:
  language: en-US
llm-pi-ai:
  providers:
    fixture-provider:
      apiKeyEnv: FIXTURE_API_KEY
      api: openai-completions
      baseURL: 'http://127.0.0.1:9999/v1'
      models:
        - id: 'fixture-model'
    github-copilot:
      displayName: GitHub Copilot
      models:
        - id: 'fixture-responses-model'
          api: openai-responses
        - id: 'fixture-completions-model'
          api: openai-completions
