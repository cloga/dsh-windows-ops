name: Native ASAR release qualification (manual, no install)

# Tracking: cloga/dsh-windows-ops#161. No push/PR/release trigger or publication.
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Exact reviewed Desktop version in the checked-in ASAR deployment lock
        required: true
        type: string
  # Same-repository caller resolves this file at the exact reviewed caller commit.
  # The job guard below retains manual-only execution even when called elsewhere.
  workflow_call:
    inputs:
      confirm_version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-asar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      # checkout requires a workspace-relative path. Only this credential-free
      # bootstrap lives there; all acquisition/build/profile work is in RUNNER_TEMP.
      - name: Checkout Ops bootstrap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ops-bootstrap
          persist-credentials: false
          fetch-depth: 1

      - name: Reject legacy lock before acquisition and prepare private work area
        id: private
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 native binary redirection is required' }
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'ops-bootstrap'
          $lock = Get-Content -LiteralPath (Join-Path $bootstrap 'deployments/windows-copilot.lock.json') -Raw | ConvertFrom-Json
          $desktop = $lock.components.desktop
          if ($desktop.installedRuntimeDescriptor.relativePath.Replace('\', '/') -cne 'resources/app.asar/dsh/desktop-runtime.json' -or
              $desktop.releaseChannel.upstreamVersion -cnotmatch '^0\.1\.6(?:-|$)' -or
              $env:CONFIRM_VERSION -cne $desktop.version) { throw 'native-asar-release-requires-reviewed-asar-lock-and-exact-confirmation' }
          $node = $desktop.releaseChannel.build.nodeVersion -creplace '^v', ''
          $pnpm = $desktop.releaseChannel.build.pnpmVersion
          if ($node -cnotmatch '^\d+\.\d+\.\d+$' -or $pnpm -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Exact locked toolchain versions are required' }
          if ($desktop.source.commit -cnotmatch '^[a-f0-9]{40}$' -or $desktop.source.tree -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact source identity is required' }
          function Assert-OrdinaryDirectory([string] $Path) {
            $item = Get-Item -LiteralPath $Path -Force
            while ($null -ne $item) {
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private work root must not traverse a reparse point' }
              $item = $item.Parent
            }
          }
          Assert-OrdinaryDirectory $env:RUNNER_TEMP
          if ($env:RUNNER_TEMP -match '(?i)(^|[\\/])OneDrive([\\/ ]|$)' -or $env:RUNNER_TEMP.StartsWith('\\')) { throw 'Private work root must be local and non-synchronized' }
          foreach ($entry in Get-ChildItem Env: | Where-Object Name -Like 'OneDrive*') {
            if ($entry.Value -and ($env:RUNNER_TEMP.TrimEnd('\') + '\').StartsWith($entry.Value.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Private work root is synchronized' }
          }
          $root = Join-Path $env:RUNNER_TEMP ('native-asar-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $root /inheritance:r /grant:r "*${sid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not restrict private work directory access' }
          foreach ($name in @('ops', 'evidence', 'logs', 'output', 'tmp', 'toolcache', 'tooling', 'pnpm-store', 'npm-cache', 'no-hooks')) {
            New-Item -ItemType Directory -Path (Join-Path $root $name) | Out-Null
          }
          # Copy tracked Ops bytes only: never carry untracked files, .git or credentials.
          & git -C $bootstrap archive --format=tar "--output=$(Join-Path $root 'ops.tar')" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the selected Ops revision' }
          & tar.exe -xf (Join-Path $root 'ops.tar') -C (Join-Path $root 'ops')
          if ($LASTEXITCODE -ne 0) { throw 'Could not materialize private Ops tooling' }
          Remove-Item -LiteralPath (Join-Path $root 'ops.tar') -Force
          $userConfig = Join-Path $root 'npm-userconfig'
          [IO.File]::WriteAllText($userConfig, 'store-dir=' + (Join-Path $root 'pnpm-store').Replace('\', '/') + "`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $root 'npm-globalconfig'), '', [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $root 'git-globalconfig'), '', [Text.UTF8Encoding]::new($false))
          "root=$root" >> $env:GITHUB_OUTPUT
          "node=$node" >> $env:GITHUB_OUTPUT
          "pnpm=$pnpm" >> $env:GITHUB_OUTPUT
          "OPS_ROOT=$(Join-Path $root 'ops')" >> $env:GITHUB_ENV
          "PRIVATE_ROOT=$root" >> $env:GITHUB_ENV
          "TEMP=$(Join-Path $root 'tmp')" >> $env:GITHUB_ENV
          "TMP=$(Join-Path $root 'tmp')" >> $env:GITHUB_ENV
          "NPM_CONFIG_CACHE=$(Join-Path $root 'npm-cache')" >> $env:GITHUB_ENV
          "NPM_CONFIG_USERCONFIG=$userConfig" >> $env:GITHUB_ENV
          "NPM_CONFIG_GLOBALCONFIG=$(Join-Path $root 'npm-globalconfig')" >> $env:GITHUB_ENV
          "COREPACK_HOME=$(Join-Path $root 'tooling/corepack')" >> $env:GITHUB_ENV
          "GH_CONFIG_DIR=$(Join-Path $root 'tooling/gh')" >> $env:GITHUB_ENV
          'GH_PROMPT_DISABLED=1' >> $env:GITHUB_ENV
          'GH_NO_UPDATE_NOTIFIER=1' >> $env:GITHUB_ENV

      - name: Select exact locked Node in private tool cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, already used by Ops
        env:
          RUNNER_TOOL_CACHE: ${{ steps.private.outputs.root }}/toolcache
        with:
          node-version: ${{ steps.private.outputs.node }}
          check-latest: false
          package-manager-cache: false

      - name: Select exact locked pnpm in private tooling
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ steps.private.outputs.pnpm }}
          dest: ${{ steps.private.outputs.root }}/tooling/pnpm
          run_install: false

      - name: Plan exact immutable release acquisition
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = Join-Path $env:OPS_ROOT 'tests/native-asar-release-smoke.mjs'
          & node $driver --plan --lock (Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json') --confirm-version $env:CONFIRM_VERSION > (Join-Path $env:PRIVATE_ROOT 'plan.json') 2> (Join-Path $env:PRIVATE_ROOT 'logs/plan.stderr')
          if ($LASTEXITCODE -ne 0) { throw 'native-asar-release-plan-rejected' }
          $plan = Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'plan.json') -Raw | ConvertFrom-Json
          if ($plan.schemaVersion -ne 1 -or $plan.sourceRepository -cne 'cloga/deepseek-harness' -or $plan.sourceCommit -cnotmatch '^[a-f0-9]{40}$') { throw 'native-asar-release-plan-invalid' }

      - name: Acquire and verify immutable Release metadata before downloading assets
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:PRIVATE_ROOT 'evidence'
          $lockPath = Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json'
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          $plan = Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'plan.json') -Raw | ConvertFrom-Json
          $repo = $plan.sourceRepository
          function Get-GitHubJson([string] $Endpoint) {
            $raw = & gh api --hostname github.com -H 'X-GitHub-Api-Version: 2022-11-28' $Endpoint 2> (Join-Path $env:PRIVATE_ROOT 'logs/acquisition.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-release-metadata-acquisition-failed' }
            return ($raw -join "`n")
          }
          try {
            $raw = Get-GitHubJson "repos/$repo/releases/$($lock.components.desktop.artifact.releaseId)"
            [IO.File]::WriteAllText((Join-Path $evidence 'github-release.json'), $raw, [Text.UTF8Encoding]::new($false))
            $ref = Get-GitHubJson "repos/$repo/git/ref/tags/$([Uri]::EscapeDataString($plan.sourceTag))" | ConvertFrom-Json
            $tags = @()
            $object = $ref.object
            while ($object.type -ceq 'tag') {
              if ($tags.Count -ge 4 -or $object.sha -cnotmatch '^[a-f0-9]{40}$') { throw 'native-asar-release-tag-chain-invalid' }
              $tag = Get-GitHubJson "repos/$repo/git/tags/$($object.sha)" | ConvertFrom-Json
              if ($tag.sha -cne $object.sha) { throw 'native-asar-release-tag-object-mismatch' }
              $tags += $tag
              $object = $tag.object
            }
            if ($object.type -cne 'commit' -or $object.sha -cnotmatch '^[a-f0-9]{40}$') { throw 'native-asar-release-tag-target-invalid' }
            $commit = Get-GitHubJson "repos/$repo/git/commits/$($object.sha)" | ConvertFrom-Json
            $chain = @{ ref = $ref; tags = $tags; commit = $commit } | ConvertTo-Json -Depth 40
            [IO.File]::WriteAllText((Join-Path $evidence 'github-tag-chain.json'), $chain, [Text.UTF8Encoding]::new($false))
            # Verifies release ID/tag/immutable and exact dereferenced source SHA/tree,
            # plus locked asset IDs/names/URLs/sizes. Must precede every asset request.
            & node (Join-Path $env:OPS_ROOT 'tests/native-asar-release-smoke.mjs') --verify-metadata --lock $lockPath --confirm-version $env:CONFIRM_VERSION --evidence-root $evidence > (Join-Path $env:PRIVATE_ROOT 'logs/metadata.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/metadata.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-release-metadata-rejected' }
          } finally { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue }

      - name: Acquire exact selected assets and attest installer as data
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'plan.json') -Raw | ConvertFrom-Json
          $lockPath = Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json'
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          $evidence = Join-Path $env:PRIVATE_ROOT 'evidence'
          $release = Get-Content -LiteralPath (Join-Path $evidence 'github-release.json') -Raw | ConvertFrom-Json
          try {
            foreach ($asset in $plan.assets) {
              if ($asset.name -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or $asset.id -le 0) { throw 'native-asar-release-asset-selection-invalid' }
              $path = Join-Path $evidence $asset.name
              # PowerShell >=7.4 preserves the native stdout byte stream; never run it.
              & gh api --hostname github.com -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$($plan.sourceRepository)/releases/assets/$($asset.id)" > $path 2> (Join-Path $env:PRIVATE_ROOT 'logs/asset.stderr')
              if ($LASTEXITCODE -ne 0) { throw 'native-asar-release-asset-acquisition-failed' }
              $metadata = @($release.assets | Where-Object { $_.id -eq $asset.id -and $_.name -ceq $asset.name })
              if ($metadata.Count -ne 1 -or (Get-Item -LiteralPath $path).Length -ne $metadata[0].size -or
                  ($null -ne $asset.bytes -and (Get-Item -LiteralPath $path).Length -ne $asset.bytes) -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $asset.sha256) { throw 'native-asar-release-asset-bytes-mismatch' }
            }
            $installer = Join-Path $evidence $plan.installerName
            $sha512 = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash -LiteralPath $installer -Algorithm SHA512).Hash))
            if ($sha512 -cne $lock.components.desktop.artifact.sha512) { throw 'native-asar-release-installer-sha512-mismatch' }
            & node (Join-Path $env:OPS_ROOT 'tests/native-asar-release-smoke.mjs') --verify-acquisition --lock $lockPath --confirm-version $env:CONFIRM_VERSION --evidence-root $evidence > (Join-Path $env:PRIVATE_ROOT 'logs/assets.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/assets.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-release-acquisition-rejected' }
          } finally { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue }

      - name: Acquire exact locked source with non-persisted read-only authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'plan.json') -Raw | ConvertFrom-Json
          $source = Join-Path $env:PRIVATE_ROOT 'source'
          # Process-only Git configuration; never write an auth header/token to .git.
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:PRIVATE_ROOT 'git-globalconfig'
          $env:GIT_CONFIG_COUNT = '3'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:GH_TOKEN))
          $env:GIT_CONFIG_KEY_1 = 'core.hooksPath'
          $env:GIT_CONFIG_VALUE_1 = Join-Path $env:PRIVATE_ROOT 'no-hooks'
          $env:GIT_CONFIG_KEY_2 = 'core.autocrlf'
          $env:GIT_CONFIG_VALUE_2 = 'false'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_TRACE = '0'
          $env:GIT_TRACE_CURL = '0'
          try {
            & git init --quiet $source 2> (Join-Path $env:PRIVATE_ROOT 'logs/git.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-source-init-failed' }
            & git -C $source remote add origin "https://github.com/$($plan.sourceRepository).git" 2> (Join-Path $env:PRIVATE_ROOT 'logs/git.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-source-remote-failed' }
            & git -C $source fetch --quiet --no-tags --depth=1 origin $plan.sourceCommit 2> (Join-Path $env:PRIVATE_ROOT 'logs/git.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-source-fetch-failed' }
            & git -C $source checkout --quiet --detach FETCH_HEAD 2> (Join-Path $env:PRIVATE_ROOT 'logs/git.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-source-checkout-failed' }
            $head = & git -C $source rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $head -cne $plan.sourceCommit) { throw 'native-asar-source-head-mismatch' }
            $tree = & git -C $source rev-parse 'HEAD^{tree}'
            if ($LASTEXITCODE -ne 0 -or $tree -cne $plan.sourceTree) { throw 'native-asar-source-tree-mismatch' }
          } finally {
            foreach ($name in @('GH_TOKEN', 'GIT_CONFIG_COUNT', 'GIT_CONFIG_NOSYSTEM', 'GIT_CONFIG_GLOBAL', 'GIT_CONFIG_KEY_0', 'GIT_CONFIG_VALUE_0', 'GIT_CONFIG_KEY_1', 'GIT_CONFIG_VALUE_1', 'GIT_CONFIG_KEY_2', 'GIT_CONFIG_VALUE_2', 'GIT_TERMINAL_PROMPT', 'GIT_TRACE', 'GIT_TRACE_CURL')) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
          }

      - name: Verify source and build only frozen Host libraries without credentials
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          DSH_TELEMETRY_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in @(Get-ChildItem Env:)) {
            if ($entry.Name -match '(?i)(TOKEN|SECRET|PASSWORD|CREDENTIAL|AUTH|COOKIE|API[_-]?KEY|ACCESS_KEY|^GIT_CONFIG_|^NODE_OPTIONS$|^NODE_PATH$|^DSH_)' -and
                -not ($entry.Name -ceq 'DSH_TELEMETRY_DISABLED' -and $entry.Value -ceq '1')) { Remove-Item "Env:$($entry.Name)" -ErrorAction SilentlyContinue }
          }
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:PRIVATE_ROOT 'git-globalconfig'
          $plan = Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'plan.json') -Raw | ConvertFrom-Json
          $source = Join-Path $env:PRIVATE_ROOT 'source'
          $driver = Join-Path $env:OPS_ROOT 'tests/native-asar-release-smoke.mjs'
          $lockPath = Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json'
          $nodeVersion = & node --version
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -cne ('v' + $plan.nodeVersion)) { throw 'native-asar-node-version-mismatch' }
          $pnpmVersion = & pnpm --version
          if ($LASTEXITCODE -ne 0 -or $pnpmVersion -cne $plan.pnpmVersion) { throw 'native-asar-pnpm-version-mismatch' }
          # Source build registry is distinct from the immutable plugin plan's
          # dependencyRegistry. Never rewrite that native provisioning source.
          $env:NPM_CONFIG_REGISTRY = [string]$plan.packageRegistry
          Push-Location $source
          try {
            & node $driver --verify-source --lock $lockPath --confirm-version $env:CONFIRM_VERSION --source-root $source > (Join-Path $env:PRIVATE_ROOT 'logs/source-before.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/source-before.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-source-before-build-rejected' }
            $registry = & pnpm config get registry 2> (Join-Path $env:PRIVATE_ROOT 'logs/registry.stderr')
            if ($LASTEXITCODE -ne 0 -or ([uri]$registry).AbsoluteUri -cne ([uri]$plan.packageRegistry).AbsoluteUri) { throw 'native-asar-source-registry-mismatch' }
            & pnpm install --frozen-lockfile > (Join-Path $env:PRIVATE_ROOT 'logs/install.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/install.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-frozen-source-install-failed' }
            & pnpm run build:lib:host > (Join-Path $env:PRIVATE_ROOT 'logs/build.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/build.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-host-library-build-failed' }
            & node $driver --verify-source --lock $lockPath --confirm-version $env:CONFIRM_VERSION --source-root $source > (Join-Path $env:PRIVATE_ROOT 'logs/source-after.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/source-after.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-source-after-build-rejected' }
          } finally { Pop-Location }

      - name: Extract verified NSIS payload as data using existing runner 7-Zip
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'plan.json') -Raw | ConvertFrom-Json
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          $tool = Get-Item -LiteralPath $sevenZip
          if ($tool.PSIsContainer -or ($tool.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Existing runner 7-Zip is required' }
          $applicationRoot = Join-Path $env:PRIVATE_ROOT 'application'
          $installer = Join-Path $env:PRIVATE_ROOT ('evidence/' + $plan.installerName)
          $lockedInstaller = @($plan.assets | Where-Object name -CEQ $plan.installerName)
          if ($lockedInstaller.Count -ne 1) { throw 'native-asar-installer-selection-invalid' }
          $resultPath = Join-Path $env:PRIVATE_ROOT 'extraction.json'
          # No full NSIS unpack: exhaustive metadata gates select ONE literal member,
          # whose raw stdout is capped before each write to a fixed private file.
          # Forced NSIS/7z formats, 7z magic and strict known inner sizes are separate.
          & node (Join-Path $env:OPS_ROOT 'tools/native-asar-extract.mjs') --seven-zip $sevenZip --installer $installer --installer-sha256 $lockedInstaller[0].sha256 --installer-bytes $lockedInstaller[0].bytes --work-root $env:PRIVATE_ROOT > $resultPath 2> (Join-Path $env:PRIVATE_ROOT 'logs/extraction.stderr')
          $extractionExit = $LASTEXITCODE
          if ((Get-Item -LiteralPath $resultPath).Length -gt 16384) { throw 'native-asar-extraction-output-invalid' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.schemaVersion -ne 1 -or $result.valid -isnot [bool]) { throw 'native-asar-extraction-output-invalid' }
          if ($extractionExit -ne 0) {
            if ((($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'reason,schemaVersion,stage,valid' -or
                $result.valid -cne $false -or $result.reason -isnot [string] -or $result.reason -cnotmatch '^native-[a-z-]{1,128}$' -or
                $result.stage -isnot [string] -or $result.stage -cnotin @('preflight','nsis-listing','nsis-selected-stream','7z-listing','7z-extraction','extracted-inventory')) { throw 'native-asar-extraction-output-invalid' }
            Write-Host ('ASAR_EXTRACTION_DIAGNOSTIC ' + (@{ stage = $result.stage; reason = $result.reason; valid = $false } | ConvertTo-Json -Compress))
            throw 'native-asar-controlled-extraction-failed'
          }
          if ((($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'extraction,innerDeclaredBytes,innerEntryCount,installerSha256,nsisEntryCount,nsisSelectedSizeKnown,payloadBytes,payloadSha256,schemaVersion,valid' -or
              $result.valid -cne $true -or $result.extraction -cne 'selected-nsis-payload-to-strict-7z' -or
              $result.installerSha256 -isnot [string] -or $result.installerSha256 -cne $lockedInstaller[0].sha256 -or
              $result.payloadSha256 -isnot [string] -or $result.payloadSha256 -cnotmatch '^[a-f0-9]{64}$' -or
              $result.nsisSelectedSizeKnown -isnot [bool]) { throw 'native-asar-extraction-output-invalid' }
          foreach ($name in @('payloadBytes', 'innerDeclaredBytes', 'nsisEntryCount', 'innerEntryCount')) {
            if (($result.$name -isnot [long] -and $result.$name -isnot [int]) -or $result.$name -lt 0) { throw 'native-asar-extraction-output-invalid' }
          }
          if ($result.payloadBytes -le 0 -or $result.payloadBytes -gt 4GB -or $result.innerDeclaredBytes -gt 16GB -or
              $result.nsisEntryCount -le 0 -or $result.nsisEntryCount -gt 200000 -or $result.innerEntryCount -le 0 -or
              $result.innerEntryCount -gt 200000) { throw 'native-asar-extraction-output-invalid' }
          # Maintained read-only ASAR reader independently verifies root package.json
          # name + full release version (PE ProductVersion is numeric only).
          & node (Join-Path $env:OPS_ROOT 'tests/native-asar-release-smoke.mjs') --discover-application --lock (Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json') --confirm-version $env:CONFIRM_VERSION --extract-root $applicationRoot > (Join-Path $env:PRIVATE_ROOT 'application.json') 2> (Join-Path $env:PRIVATE_ROOT 'logs/discovery.stderr')
          if ($LASTEXITCODE -ne 0) { throw 'native-asar-extracted-layout-rejected' }

      - name: Qualify actual release fixture and Ops observer without credentials
        id: qualification
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          DSH_TELEMETRY_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in @(Get-ChildItem Env:)) {
            if ($entry.Name -match '(?i)(TOKEN|SECRET|PASSWORD|CREDENTIAL|AUTH|COOKIE|API[_-]?KEY|ACCESS_KEY|^GIT_CONFIG_|^NODE_OPTIONS$|^NODE_PATH$|^DSH_)' -and
                -not ($entry.Name -ceq 'DSH_TELEMETRY_DISABLED' -and $entry.Value -ceq '1')) { Remove-Item "Env:$($entry.Name)" -ErrorAction SilentlyContinue }
          }
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:PRIVATE_ROOT 'git-globalconfig'
          $source = Join-Path $env:PRIVATE_ROOT 'source'
          $application = (Get-Content -LiteralPath (Join-Path $env:PRIVATE_ROOT 'application.json') -Raw | ConvertFrom-Json).application
          Push-Location $source
          try {
            # tsx resolves from the exact verified source, not from an Ops/ambient install.
            # The source observer awaits Ops checks before its owned-profile finally cleanup.
            # Alpha.2 captures genuine Ops caller identity, then omits only GITHUB_SHA around the Core call
            # inside this dedicated CLI and restores it in finally. Never spoof a Core GITHUB_SHA.
            & node --import tsx/esm (Join-Path $env:OPS_ROOT 'tests/native-asar-release-smoke.mjs') --run --lock (Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json') --confirm-version $env:CONFIRM_VERSION --source-root $source --application $application --output (Join-Path $env:PRIVATE_ROOT 'output') --evidence-root (Join-Path $env:PRIVATE_ROOT 'evidence') > (Join-Path $env:PRIVATE_ROOT 'logs/run.stdout') 2> (Join-Path $env:PRIVATE_ROOT 'logs/run.stderr')
            if ($LASTEXITCODE -ne 0) { throw 'native-asar-real-release-qualification-failed-see-sanitized-summary' }
          } finally { Pop-Location }

      - name: Validate summary-only artifact boundary
        id: summary
        if: ${{ !cancelled() && (steps.qualification.outcome == 'success' || steps.qualification.outcome == 'failure') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:PRIVATE_ROOT 'output/qualification.json'
          $file = Get-Item -LiteralPath $path -Force
          if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $file.Length -gt 16384) { throw 'native-asar-summary-artifact-invalid' }
          $summary = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
          $lock = Get-Content -LiteralPath (Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json') -Raw | ConvertFrom-Json
          $alpha2 = $lock.components.desktop.releaseChannel.upstreamVersion -ceq '0.1.6-alpha.2'
          $schema = if ($alpha2) { 2 } else { 1 }
          if ($alpha2) {
            if ($summary.valid -eq $true -and ($summary.sourceCommit -cne $lock.components.desktop.source.commit -or
                $summary.sourceTree -cne $lock.components.desktop.source.tree)) { throw 'native-asar-core-identity-invalid' }
            $caller = $summary.caller
            if ($caller -isnot [System.Collections.IDictionary] -or
                (($caller.psbase.Keys | Sort-Object) -join ',') -cne 'repository,runAttempt,runId,sourceCommit' -or
                $caller.repository -isnot [string] -or $caller.sourceCommit -isnot [string] -or
                $caller.runId -isnot [string] -or $caller.runAttempt -isnot [string] -or
                $caller.repository -cne 'cloga/dsh-windows-ops' -or $caller.repository -cne $env:GITHUB_REPOSITORY -or
                $caller.sourceCommit -cnotmatch '^[a-f0-9]{40}$' -or $caller.sourceCommit -cne $env:GITHUB_SHA -or
                $caller.runId -cnotmatch '^[1-9][0-9]*$' -or $caller.runId -cne $env:GITHUB_RUN_ID -or
                $caller.runAttempt -cnotmatch '^[1-9][0-9]*$' -or $caller.runAttempt -cne $env:GITHUB_RUN_ATTEMPT) { throw 'native-asar-caller-identity-invalid' }
          }
          if ($summary.schemaVersion -ne $schema -or $summary.valid -isnot [bool] -or $summary.modelResponseVerified -cne $false -or
              $summary.observerCalls -isnot [long] -and $summary.observerCalls -isnot [int]) { throw 'native-asar-summary-artifact-invalid' }
          if ($summary.valid) {
            $keys = 'applicationPackageName,applicationPackageSha256,applicationPackageVersion,descriptorSha256,executableSha256,installerSha256,installerUpgradeVerified,invalidRequests,modelResponseVerified,observerCalls,profileRemoved,publicResolver,qualification,runtimeFileCount,schemaVersion,sourceCommit,sourceTree,valid,version,wholeCarrierAttested'
            $lock = Get-Content -LiteralPath (Join-Path $env:OPS_ROOT 'deployments/windows-copilot.lock.json') -Raw | ConvertFrom-Json
            if ($summary.qualification -cne 'locked-release-ops-observer' -or $summary.publicResolver -cne 'metadata-cjs-esm' -or
                $summary.profileRemoved -cne $true -or $summary.wholeCarrierAttested -cne $false -or $summary.installerUpgradeVerified -cne $false -or
                $summary.version -isnot [string] -or $summary.version -cnotmatch '^0\.1\.6(?:-[A-Za-z0-9.-]+)?$' -or $summary.version -cne $lock.components.desktop.version -or
                $summary.applicationPackageName -isnot [string] -or $summary.applicationPackageVersion -isnot [string] -or
                $summary.applicationPackageSha256 -isnot [string] -or
                $summary.applicationPackageName -cne $lock.components.desktop.releaseChannel.identity.packageName -or
                $summary.applicationPackageVersion -cne $summary.version -or $summary.sourceCommit -cnotmatch '^[a-f0-9]{40}$' -or
                $summary.sourceTree -cnotmatch '^[a-f0-9]{40}$' -or $summary.observerCalls -ne 1 -or
                ($summary.runtimeFileCount -isnot [long] -and $summary.runtimeFileCount -isnot [int]) -or
                $summary.runtimeFileCount -le 0 -or $summary.runtimeFileCount -gt 200000) { throw 'native-asar-summary-artifact-invalid' }
            foreach ($name in @('installerSha256', 'executableSha256', 'descriptorSha256', 'applicationPackageSha256')) { if ($summary[$name] -cnotmatch '^[a-f0-9]{64}$') { throw 'native-asar-summary-artifact-invalid' } }
            if ((($summary.invalidRequests.psbase.Keys | Sort-Object) -join ',') -cne 'descriptorDigest,home,version' -or
                @($summary.invalidRequests.psbase.Values | Where-Object { $_ -cne 'rejected' }).Count -ne 0) { throw 'native-asar-summary-artifact-invalid' }
          } else {
            $keys = 'diagnostic,modelResponseVerified,observerCalls,profileRemoved,qualification,reason,schemaVersion,valid'
            if ($summary.qualification -cne 'not-ready' -or $summary.reason -cnotmatch '^native-[a-z-]{1,128}$' -or
                ($null -ne $summary.profileRemoved -and $summary.profileRemoved -isnot [bool])) { throw 'native-asar-summary-artifact-invalid' }
            $diagnostic = $summary.diagnostic
            if ($diagnostic -isnot [System.Collections.IDictionary] -or
                (($diagnostic.psbase.Keys | Sort-Object) -join ',') -cne 'code,sourceFailure,sourcePhase,stage') { throw 'native-asar-summary-artifact-invalid' }
            $stages = @('source-import','source-fixture','observer','post-acceptance','final-runtime')
            $codes = @('unknown','desktop-startup','locator-timeout','electron-launch','assertion','child-command','module-not-found','native-addon','access-denied','missing-file','package-export')
            $phases = @('none','package-identity') + @(foreach ($phase in @('initial','restart')) { foreach ($step in @('launch','application','account','settings-readonly','packaged-graph','closed')) { "${phase}:$step" } })
            if ($diagnostic.stage -isnot [string] -or $diagnostic.stage -cnotin $stages -or
                $diagnostic.code -isnot [string] -or $diagnostic.code -cnotin $codes -or
                $diagnostic.sourcePhase -isnot [string] -or $diagnostic.sourcePhase -cnotin $phases -or
                $diagnostic.sourceFailure -isnot [string] -or $diagnostic.sourceFailure -cnotin @('absent','present','unreadable')) { throw 'native-asar-summary-artifact-invalid' }
          }
          if ($alpha2) { $keys = ((@($keys.Split(',')) + @('caller') | Sort-Object) -join ',') }
          if ((($summary.psbase.Keys | Sort-Object) -join ',') -cne $keys) { throw 'native-asar-summary-artifact-invalid' }

      - name: Retain only the sanitized qualification summary
        if: ${{ !cancelled() && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-asar-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.private.outputs.root }}/output/qualification.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Remove private source, fixture payloads and raw diagnostics
        if: ${{ always() && steps.private.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Source acceptance already has owned-home finally cleanup; this is a
          # second private-runner boundary. Never upload raw receipts, profiles,
          # source outputs, logs or dependencies. Preserve action tooling/config
          # until pnpm's post step; remaining private temp dies with this runner.
          $runner = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $root = [IO.Path]::GetFullPath($env:PRIVATE_ROOT).TrimEnd('\')
          if (-not $root.StartsWith($runner + '\', [StringComparison]::OrdinalIgnoreCase) -or $root -ieq $runner) { throw 'native-asar-cleanup-root-rejected' }
          $ancestor = Get-Item -LiteralPath $root -Force
          if (-not $ancestor.PSIsContainer) { throw 'native-asar-cleanup-root-rejected' }
          while ($null -ne $ancestor) {
            if (($ancestor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'native-asar-cleanup-root-reparse' }
            $ancestor = $ancestor.Parent
          }
          $script:cleanupEntries = 0
          function Remove-PrivateEntry([string] $Path, [int] $Depth) {
            $full = [IO.Path]::GetFullPath($Path)
            if (-not $full.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase) -or $Depth -gt 128 -or ++$script:cleanupEntries -gt 1000000) { throw 'native-asar-cleanup-boundary-rejected' }
            $item = Get-Item -LiteralPath $full -Force -ErrorAction SilentlyContinue
            if ($null -eq $item) { return }
            $directory = ($item.Attributes -band [IO.FileAttributes]::Directory) -ne 0
            # Unlink first; never enumerate or recursively delete a reparse target.
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              if ($directory) { [IO.Directory]::Delete($full, $false) }
              else { [IO.File]::Delete($full) }
              return
            }
            # Git/pnpm can leave ordinary files read-only. Never touch attributes
            # on a reparse entry or its target: those returned above.
            if (($item.Attributes -band [IO.FileAttributes]::ReadOnly) -ne 0) {
              $attributes = $item.Attributes -band (-bnot [IO.FileAttributes]::ReadOnly)
              [IO.File]::SetAttributes($full, [IO.FileAttributes]$attributes)
            }
            if ($directory) {
              foreach ($child in Get-ChildItem -LiteralPath $full -Force) { Remove-PrivateEntry $child.FullName ($Depth + 1) }
              [IO.Directory]::Delete($full, $false)
            } else { [IO.File]::Delete($full) }
          }
          foreach ($name in @('source', 'application', 'nsis', 'evidence', 'logs', 'output', 'ops', 'application.json', 'extraction.json', 'plan.json')) {
            Remove-PrivateEntry (Join-Path $root $name) 0
          }
