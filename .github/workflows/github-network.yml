name: GitHub network toolkit
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-safety:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check tools/github-network.mjs
      - run: node --test tests/github-network.test.mjs
      - name: Check PowerShell compatibility entry syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/gh-dl.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw 'PowerShell syntax errors in gh-dl.ps1' }
