name: Windows Copilot deployment lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-copilot-lock.yml'
      - 'deployments/windows-copilot.lock.json'
      - 'tests/DshWindowsOps.Tests.ps1'
      - 'tests/WindowsCopilotInstaller.Tests.ps1'
      - 'tests/fixtures/windows-copilot/**'
      - 'tools/DshWindowsOps.psm1'
      - 'tools/WindowsCopilotDeployment.psm1'
      - 'tools/install-windows-copilot.ps1'
  push:
    branches: [master]
    paths:
      - '.github/workflows/windows-copilot-lock.yml'
      - 'deployments/windows-copilot.lock.json'
      - 'tests/DshWindowsOps.Tests.ps1'
      - 'tests/WindowsCopilotInstaller.Tests.ps1'
      - 'tests/fixtures/windows-copilot/**'
      - 'tools/DshWindowsOps.psm1'
      - 'tools/WindowsCopilotDeployment.psm1'
      - 'tools/install-windows-copilot.ps1'

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixture tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          $pester = Get-Module Pester -ListAvailable |
            Where-Object Version -ge ([version]'5.7.1') |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester) {
            throw 'Pester 5.7.1 or newer is required.'
          }
          Import-Module $pester.Path -Force
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }
