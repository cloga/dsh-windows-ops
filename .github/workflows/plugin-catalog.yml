name: Plugin catalog validation

on:
  workflow_dispatch:
    inputs:
      qualify_native_asar:
        description: Run genuine locked ASAR release qualification on this reviewed ref
        type: boolean
        required: false
        default: false
      confirm_version:
        description: Exact locked Desktop version required when qualification is enabled
        type: string
        required: false
        default: ''
  pull_request:
  push:
    branches: [master]

concurrency:
  group: plugin-catalog-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.qualify_native_asar && 'native-qualification' || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualify_native_asar }}

permissions:
  contents: read

jobs:
  # This workflow is already registered on the default branch. Dispatching its
  # reviewed PR ref can qualify the same-commit reusable workflow before PR merge.
  native-asar-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_native_asar == true }}
    needs: [validate, repository-content, repository-policy]
    permissions:
      contents: read
    uses: ./.github/workflows/native-asar-release.yml
    with:
      confirm_version: ${{ inputs.confirm_version }}

  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 0a15e36e7f82b6ed45af6fa9759f29b40dcd965d
          path: dsh-0.1.6
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact package manager
        shell: powershell
        run: npm install --global pnpm@11.7.0
      - name: Install exact 0.1.6 test closure
        working-directory: dsh-0.1.6
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-root' --filter '@deepseek-ai/dsh-tools...' --filter '@deepseek-ai/dsh-subprocess...'
      - name: Validate repository, catalog, plugin, and scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DSH_016_ROOT = Join-Path $PWD 'dsh-0.1.6'
          node tools\validate-repository-content.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools\validate-plugin-catalog.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests\repository-content.test.mjs tests\dsh-dev-tools.test.mjs tests\plugin-catalog.test.mjs tests\host-playwright-bundle.test.mjs tests\preflight-check.test.mjs tests\native-desktop-acceptance.test.mjs tests\native-profile-metadata.test.mjs tests\native-asar-release-smoke.test.mjs tests\native-archive-process.test.mjs tests\native-asar-extract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @(
            'tools\dsh-compat-check.mjs', 'tools\validate-plugin-catalog.mjs',
            'tools\validate-repository-content.mjs', 'tools\dsh-doctor.mjs',
            'tools\dsh-dev-tools\index.js', 'tools\dsh-dev-tools\snapshot-json.js',
            'tools\preflight-check.mjs', 'tools\native-asar-runtime.mjs',
            'tools\native-electron-probe.mjs', 'tools\native-runtime-integrity.mjs',
            'tools\native-profile-metadata.mjs', 'tools\native-archive-process.mjs',
            'tools\native-asar-extract.mjs'
          )) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  repository-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/validate-repository-content.mjs
      - run: node --test tests/repository-content.test.mjs tests/core-upgrade.test.mjs

  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Enforce collaboration policy
        shell: bash
        run: |
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/ISSUE_TEMPLATE/deployment-bug.yml
          test -f .github/CODEOWNERS
          grep -Fq 'Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>' AGENTS.md
