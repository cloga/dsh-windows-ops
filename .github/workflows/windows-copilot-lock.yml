name: Windows Copilot deployment lock

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: windows-copilot-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run fixture tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          $pester = Get-Module Pester -ListAvailable |
            Where-Object Version -ge ([version]'5.7.1') |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester) {
            throw 'Pester 5.7.1 or newer is required.'
          }
          Import-Module $pester.Path -Force
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.Result -ne 'Passed' -or $result.FailedCount -gt 0) {
            exit 1
          }
